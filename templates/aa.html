<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Караоке</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }
        
        .header {
            background: #333;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            color: white;
            font-size: 20px;
            font-weight: bold;
        }
        
        .nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }
        
        .nav a:hover {
            text-decoration: underline;
        }
        
        .main {
            text-align: center;
            padding: 80px 20px;
        }
        
        .main h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }
        
        .main p {
            font-size: 18px;
            color: #666;
            margin-bottom: 30px;
        }
        
        .btn {
            background: #333;
            color: white;
            padding: 12px 30px;
            text-decoration: none;
            display: inline-block;
            border-radius: 5px;
        }
        
        .footer {
            background: #ddd;
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: #666;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>
<div class="header">
    <div class="logo">🎤 Караоке</div>
    <div class="nav">
        <a href="#">Главная</a>
        <a href="#">Песни</a>
        <a href="#">Регистрация</a>
    </div>
</div>

<div class="main">
    <h1>Пой в караоке</h1>
    <p>Тысячи песен, тексты в такт, записи выступлений</p>
    <a href="#" class="btn">Начать петь</a>
</div>

<div class="footer">
    Караоке-приложение
</div>
</body>
</html>
